// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        // Rosenweg: commons-rosenweg (ch.rosenweg4303:*) aus GitHub Packages. Anmeldedaten lokal aus
        // ~/.gradle/gradle.properties (gpr.user/gpr.key), in Actions GPR_TOKEN oder GITHUB_TOKEN.
        // Ohne Anmeldedaten nur mavenLocal (Rueckfall, publishToMavenLocal).
        def gprUser = findProperty('gpr.user') ?: System.getenv('GITHUB_ACTOR')
        def gprKey = findProperty('gpr.key') ?: System.getenv('GPR_TOKEN') ?: System.getenv('GITHUB_TOKEN')
        if (gprUser && gprKey) {
            maven {
                name 'RosenwegCommons'
                url 'https://maven.pkg.github.com/Rosenweg/commons-rosenweg'
                credentials {
                    username gprUser
                    password gprKey
                }
                content { includeGroup 'ch.rosenweg4303' }
            }
        }
        // commons-rosenweg (anmeldeschirm), wie die anderen Rosenweg-Apps
        mavenLocal {
            content { includeGroup 'ch.rosenweg4303' }
        }
        // libadb-android (C: Geraet spricht selbst adb), nur diese Gruppe von JitPack
        maven {
            url 'https://jitpack.io'
            content { includeGroupByRegex 'com\\.github\\.MuntashirAkon.*' }
        }
    }
}
