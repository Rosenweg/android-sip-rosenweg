// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        // commons-rosenweg (anmeldeschirm), wie die anderen Rosenweg-Apps
        mavenLocal {
            content { includeGroup 'ch.rosenweg4303' }
        }
        // libadb-android (C: Geraet spricht selbst adb), nur diese Gruppe von JitPack
        maven {
            url 'https://jitpack.io'
            content { includeGroupByRegex 'com\\.github\\.MuntashirAkon.*' }
        }
    }
}
