# Pruefbau fuer Pull Requests: Debug-APK bauen (ohne Rosenweg-Schluessel, nicht an /apps).
# Oeffentliches Repo: GitHub-Runner. commons-rosenweg (anmeldeschirm) kommt aus GitHub Packages
# mit dem Token des Laufs (build.gradle: GITHUB_ACTOR / GITHUB_TOKEN).
name: Bauen

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: bauen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runner-Wahl (Rosenweg/rosenweg-basis, runner-wahl.yml): privat immer eigene,
  # oeffentlich eigene wenn frei oder zuschaltbar, Forks nie. macOS bleibt bei GitHub.
  wahl:
    uses: Rosenweg/rosenweg-basis/.github/workflows/runner-wahl.yml@main
    secrets:
      PAKETE_APP_ID: ${{ secrets.PAKETE_APP_ID }}
      PAKETE_APP_KEY: ${{ secrets.PAKETE_APP_KEY }}

  apk:
    runs-on: ${{ fromJSON(needs.wahl.outputs.linux) }}
    needs: wahl
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fernwartung-Bibliothek vorhanden und unveraendert (RWTUNNEL.txt)
        run: |
          cd app/src/main/jniLibs
          grep -E '^[0-9a-f]{64}  ' RWTUNNEL.txt | sha256sum -c -
      - name: Debug-APK
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./gradlew --no-daemon assembleDebug
      - name: Unit-Tests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: rwtunnel in der APK
        run: |
          for abi in arm64-v8a x86_64; do
            unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q "lib/$abi/librwtunnel_jni.so"
          done
