apply plugin: 'com.android.application'

android {
    compileSdkVersion 35

    defaultConfig {
        // Eigener Paketname: Pflicht nach ADDITIONAL_TERMS.txt (Sipdroid) und
        // damit die Variante neben dem Original installierbar ist.
        applicationId "ch.rosenweg4303.telefon"
        // 21: natives Multidex (zxing sprengt sonst die 64K-Grenze), Device-Owner-APIs
        minSdkVersion 21
        targetSdkVersion 35
        versionCode 196
        versionName "1.4-rosenweg.45"
    }

    signingConfigs {
        release {
            def keystorePropsFile = rootProject.file("keystore.properties")
            if (keystorePropsFile.exists()) {
                def keystoreProps = new Properties()
                keystoreProps.load(new FileInputStream(keystorePropsFile))
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'

            ndk.abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    externalNativeBuild {
        ndkBuild {
            path 'src/main/jni/Android.mk'
        }
    }
    namespace 'org.sipdroid.sipua'

    dependencies {
        implementation 'androidx.media:media:1.6.0'
        implementation 'com.google.android.material:material:1.11.0'
        // Rosenweg: Kamera-Scanner fuer den persoenlichen Anmelde-QR (Apache 2.0)
        implementation('com.journeyapps:zxing-android-embedded:4.3.0') { transitive = false }
        implementation 'com.google.zxing:core:3.5.3'
        implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    }
}
